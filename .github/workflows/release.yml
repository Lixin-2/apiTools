name: release

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: apitools-macos
            build: npm run dist:mac
            paths: |
              src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - os: windows-latest
            artifact: apitools-windows
            build: npm run dist
            paths: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Add macOS arm64 target
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Point lockfile at npmjs registry
        run: node -e "const fs=require('fs');const p='package-lock.json';fs.writeFileSync(p, fs.readFileSync(p,'utf8').replace(/registry\.npmmirror\.com/g,'registry.npmjs.org'))"

      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org

      - name: Build app and installer
        run: ${{ matrix.build }}
        env:
          CI: true

      - name: Zip macOS app bundle
        if: runner.os == 'macOS'
        run: |
          cd src-tauri/target/aarch64-apple-darwin/release/bundle/macos
          ditto -c -k --keepParent apiTools.app "$GITHUB_WORKSPACE/apitools-macos-arm64.zip"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: ${{ matrix.paths }}

      - name: Upload macOS app bundle
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: apitools-macos-app
          if-no-files-found: error
          path: apitools-macos-arm64.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
