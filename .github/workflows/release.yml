name: release

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: apitools-macos
            build: npm run dist:mac
            paths: |
              src-tauri/target/**/release/bundle/dmg/*.dmg
              src-tauri/target/**/release/bundle/macos/*.tar.gz
              src-tauri/target/**/release/bundle/macos/*.sig
          - os: windows-latest
            artifact: apitools-windows
            build: npm run dist
            paths: |
              src-tauri/target/**/release/bundle/nsis/*.exe
              src-tauri/target/**/release/bundle/nsis/*.zip
              src-tauri/target/**/release/bundle/nsis/*.sig
              src-tauri/target/**/release/bundle/msi/*.msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Add macOS arm64 target
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Point lockfile at npmjs registry
        run: node -e "const fs=require('fs');const p='package-lock.json';fs.writeFileSync(p, fs.readFileSync(p,'utf8').replace(/registry\.npmmirror\.com/g,'registry.npmjs.org'))"

      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org

      - name: Prepare signing key
        shell: bash
        run: |
          KEY="${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}"
          if [ -z "$KEY" ]; then
            echo "::error::缺少 TAURI_SIGNING_PRIVATE_KEY，更新包无法签名。请在 Settings → Secrets and variables → Actions 中添加私钥内容（cat ~/.tauri/apitools.key）。"
            exit 1
          fi
          # 只保留 base64 合法字符：zsh 的 cat 会在末尾补 % 提示符，粘贴时容易一起带进来
          printf '%s' "$KEY" | tr -cd 'A-Za-z0-9+/=' > "$RUNNER_TEMP/signing.key"
          BYTES=$(wc -c < "$RUNNER_TEMP/signing.key" | tr -d ' ')
          echo "signing key: ${BYTES} bytes"
          if [ "$BYTES" -lt 200 ]; then
            echo "::error::私钥长度异常（${BYTES} bytes），可能复制不完整，请重新执行 cat ~/.tauri/apitools.key 完整粘贴。"
            exit 1
          fi

      - name: Build app and installer
        run: ${{ matrix.build }}
        env:
          CI: true
          TAURI_SIGNING_PRIVATE_KEY: ${{ runner.temp }}/signing.key
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Zip macOS app bundle
        if: runner.os == 'macOS'
        run: |
          cd src-tauri/target/aarch64-apple-darwin/release/bundle/macos
          ditto -c -k --keepParent apiTools.app "$GITHUB_WORKSPACE/apitools-macos-arm64.zip"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: ${{ matrix.paths }}

      - name: Upload macOS app bundle
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: apitools-macos-app
          if-no-files-found: error
          path: apitools-macos-arm64.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate updater manifest
        run: node scripts/make-latest-json.mjs artifacts

      - name: Collect release list for in-app changelog
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          curl -sS -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases?per_page=30" \
            -o "$RUNNER_TEMP/releases-raw.json" || echo "[]" > "$RUNNER_TEMP/releases-raw.json"
          node scripts/make-releases-json.mjs "$RUNNER_TEMP/releases-raw.json" "$VERSION"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*
            latest.json
            releases.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
