[package]
name = "apitools"
version = "1.0.11"
license = "Apache-2.0"
authors = ["apiTools contributors"]
description = "A local-first REST API debugger with import/export, load testing and MCP support"
repository = "https://github.com/Lixin-2/apiTools"
edition = "2021"
rust-version = "1.77"
default-run = "apitools"

[lib]
name = "apitools_core"
path = "src/lib.rs"

[[bin]]
name = "apitools"
path = "src/main.rs"

[[bin]]
name = "apitools-mcp"
path = "src/bin/apitools-mcp.rs"

[features]
default = ["custom-protocol"]
# 由 tauri build 使用：把前端产物嵌入二进制（生产模式）
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json", "tls"] }
base64 = "0.22"
axum = "0.7"
zip = { version = "2", default-features = false, features = ["deflate"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
notify = "6"
rand = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData"] }
objc2-app-kit = { version = "0.3", features = ["NSImage", "NSApplication"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
